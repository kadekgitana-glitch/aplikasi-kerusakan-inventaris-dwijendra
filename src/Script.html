<script>
/**
 * =============================================================================
 *  SISTEM INFORMASI KERUSAKAN INVENTARIS — SMK DWIJENDRA DENPASAR
 *  Frontend JavaScript Engine & Client Controller
 * =============================================================================
 */

// STATE APLIKASI
const AppState = {
  token: localStorage.getItem('sid_sarpras_token') || '',
  user: null,
  config: null,
  master: { barang: [], lokasi: [] },
  activeView: 'dashboard',
  charts: {},
  photosPending: { kerusakan: [], perbaikan: [] },
  modalPerbaikanPhotos: [],
  excelImportBatch: null,
  currentTableQuery: {
    page: 1,
    pageSize: 25,
    search: '',
    year: '',
    month: '',
    lokasi: '',
    status: '',
    arsip: false,
    sort: 'rusak_desc'
  }
};

const BULAN_NAMES = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
  'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

// =============================================================================
// 1. KOMUNIKASI API (RPC) DENGAN GOOGLE APPS SCRIPT
// =============================================================================

function callApi(action, payload = {}) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn('[Mock Mode] google.script.run tidak terdeteksi (lingkungan lokal).');
      return resolve({ ok: true, data: {} });
    }

    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.ok) {
          const err = new Error((res && res.error) || 'Terjadi kesalahan pada server.');
          err.code = (res && res.code) || 'SERVER_ERROR';
          err.fields = (res && res.fields) || null;
          if (err.code === 'AUTH') {
            handleSessionExpired();
          }
          reject(err);
        } else {
          resolve(res.data);
        }
      })
      .withFailureHandler((err) => {
        const error = new Error(err.message || 'Koneksi ke server Google terputus.');
        error.code = 'NETWORK_ERROR';
        reject(error);
      })
      .api(action, payload, AppState.token);
  });
}

function showToast(message, type = 'info', duration = 3500) {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  let icon = 'ℹ️';
  if (type === 'success') icon = '✅';
  if (type === 'error') icon = '❌';
  if (type === 'warning') icon = '⚠️';

  toast.innerHTML = `
    <span style="font-size:16px;">${icon}</span>
    <span class="toast-msg">${escapeHtml(message)}</span>
  `;

  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    setTimeout(() => toast.remove(), 250);
  }, duration);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  })[m]);
}

// =============================================================================
// 2. INISIALISASI APLIKASI SAAT PERTAMA KALI DIBUKA
// =============================================================================

document.addEventListener('DOMContentLoaded', async () => {
  try {
    // 1. Muat Konfigurasi Publik
    const cfg = await callApi('public.config');
    AppState.config = cfg;
    applyPublicConfig(cfg);

    // 2. Cek apakah ada sesi login aktif
    if (AppState.token) {
      try {
        const authRes = await callApi('auth.me');
        if (authRes && authRes.user) {
          onLoginSuccess(AppState.token, authRes.user);
          return;
        }
      } catch (e) {
        // Token kadaluarsa atau tidak valid
        localStorage.removeItem('sid_sarpras_token');
        AppState.token = '';
      }
    }

    // Belum login -> Tampilkan layar login
    showLoginScreen();
  } catch (err) {
    console.error('Inisialisasi aplikasi gagal:', err);
    showLoginScreen();
  }
  initBarangAutoFill();
});

function initBarangAutoFill() {
  const inputNama = document.getElementById('input-nama-barang');
  if (!inputNama) return;
  inputNama.addEventListener('input', () => {
    const val = inputNama.value.trim().toLowerCase();
    if (!val || !AppState.master || !AppState.master.barang) return;
    const match = AppState.master.barang.find(b => b.nama.toLowerCase() === val);
    const inputKode = document.getElementById('input-kode-inventaris');
    if (match && match.kode && inputKode && !inputKode.value) {
      inputKode.value = match.kode;
    }
  });
}

function applyPublicConfig(cfg) {
  if (!cfg) return;
  if (cfg.namaAplikasi) {
    document.getElementById('login-app-title').textContent = cfg.namaAplikasi.toUpperCase();
    document.getElementById('sidebar-app-name').textContent = cfg.namaAplikasi;
  }
  if (cfg.namaSekolah) {
    document.getElementById('login-school-subtitle').textContent = cfg.namaSekolah.toUpperCase();
    document.getElementById('sidebar-school-name').textContent = cfg.namaSekolah;
  }
  if (cfg.logo) {
    const lImg = document.getElementById('login-logo-img');
    const lFb = document.getElementById('login-logo-fallback');
    lImg.src = cfg.logo;
    lImg.style.display = 'block';
    lFb.style.display = 'none';

    const sImg = document.getElementById('sidebar-logo-img');
    const sIcon = document.getElementById('sidebar-logo-icon');
    sImg.src = cfg.logo;
    sImg.style.display = 'block';
    sIcon.style.display = 'none';
  }
}

function showLoginScreen() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-layout').style.display = 'none';
}

function onLoginSuccess(token, user) {
  AppState.token = token;
  AppState.user = user;
  localStorage.setItem('sid_sarpras_token', token);

  // Perbarui UI User di Sidebar
  document.getElementById('user-display-name').textContent = user.nama || user.username;
  document.getElementById('user-display-role').textContent = user.peranLabel || user.peran;
  document.getElementById('user-avatar-text').textContent = (user.nama || user.username).charAt(0).toUpperCase();

  // Atur Visibilitas Menu Sesuai Peran (Admin-only)
  const adminElements = document.querySelectorAll('.admin-only');
  adminElements.forEach((el) => {
    el.style.display = (user.peran === 'ADMIN') ? '' : 'none';
  });

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-layout').style.display = 'flex';

  // Muat Master Data & Masuk ke Dashboard
  loadMasterData();
  navigateTo('dashboard');
  showToast(`Selamat datang, ${user.nama || user.username}!`, 'success');
}

function handleSessionExpired() {
  localStorage.removeItem('sid_sarpras_token');
  AppState.token = '';
  AppState.user = null;
  showToast('Sesi Anda telah berakhir. Silakan login kembali.', 'warning');
  showLoginScreen();
}

// =============================================================================
// 3. AUTENTIKASI: LOGIN & LOGOUT
// =============================================================================

async function handleLoginSubmit(event) {
  event.preventDefault();
  const uInput = document.getElementById('login-username');
  const pInput = document.getElementById('login-password');
  const submitBtn = document.getElementById('btn-login-submit');

  const username = uInput.value.trim();
  const password = pInput.value;

  clearFieldError('login-username');
  clearFieldError('login-password');

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span>Memverifikasi...</span>';

  try {
    const res = await callApi('auth.login', { username, password });
    onLoginSuccess(res.token, res.user);
  } catch (err) {
    if (err.fields) {
      if (err.fields.username) setFieldError('login-username', err.fields.username);
      if (err.fields.password) setFieldError('login-password', err.fields.password);
    } else {
      showToast(err.message, 'error');
    }
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<span>Masuk ke Sistem</span>';
  }
}

async function handleGoogleLogin() {
  try {
    showToast('Memeriksa akun Google Anda di server...', 'info');
    const res = await callApi('auth.loginGoogle');
    onLoginSuccess(res.token, res.user);
  } catch (err) {
    showToast(err.message, 'error', 4500);
  }
}

async function quickLogin(role) {
  const accounts = {
    'admin': { u: 'admin', p: 'Admin1234!' },
    'petugas': { u: 'petugas', p: 'Petugas1234!' },
    'kepsek': { u: 'kepsek', p: 'Kepsek1234!' }
  };
  const acc = accounts[role] || accounts['admin'];
  const uInput = document.getElementById('login-username');
  const pInput = document.getElementById('login-password');
  if (uInput) uInput.value = acc.u;
  if (pInput) pInput.value = acc.p;

  clearFieldError('login-username');
  clearFieldError('login-password');

  const submitBtn = document.getElementById('btn-login-submit');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Memverifikasi...</span>';
  }

  try {
    const res = await callApi('auth.login', { username: acc.u, password: acc.p });
    onLoginSuccess(res.token, res.user);
  } catch (err) {
    showToast(err.message || 'Gagal login.', 'error');
  } finally {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Masuk ke Sistem</span>';
    }
  }
}

async function handleLogout() {
  if (!confirm('Apakah Anda yakin ingin keluar dari sistem?')) return;
  try {
    await callApi('auth.logout');
  } catch (e) { /* abaikan error */ }
  localStorage.removeItem('sid_sarpras_token');
  AppState.token = '';
  AppState.user = null;
  showToast('Anda telah berhasil keluar.', 'info');
  showLoginScreen();
}

function togglePasswordVisibility(inputId) {
  const el = document.getElementById(inputId);
  if (el) el.type = (el.type === 'password') ? 'text' : 'password';
}

// =============================================================================
// 4. ROUTING TAMPILAN (SPA NAVIGATION)
// =============================================================================

function navigateTo(viewName) {
  AppState.activeView = viewName;

  // Tutup sidebar mobile bila terbuka
  document.getElementById('sidebar').classList.remove('open');

  // Sembunyikan semua section view
  document.querySelectorAll('.app-view').forEach((sec) => sec.style.display = 'none');

  // Tampilkan section yang dipilih
  const targetSec = document.getElementById(`view-${viewName}`);
  if (targetSec) targetSec.style.display = 'block';

  // Perbarui status active di sidebar
  document.querySelectorAll('.app-sidebar .nav-item').forEach((item) => {
    item.classList.remove('active');
    const onclickAttr = item.getAttribute('onclick') || '';
    if (onclickAttr.includes(`'${viewName}'`)) {
      item.classList.add('active');
    }
  });

  // Perbarui Judul Header
  const titleMap = {
    'dashboard': ['Dashboard', 'Ringkasan kondisi inventaris dan pemantauan kerusakan'],
    'input': ['Input Data Kerusakan', 'Pencatatan kejadian kerusakan inventaris baru'],
    'data': ['Data Kerusakan Inventaris', 'Daftar seluruh kerusakan inventaris sekolah'],
    'belum': ['Data Belum Diperbaiki', 'Daftar kerusakan yang belum ditangani (prioritas)'],
    'sudah': ['Data Sudah Diperbaiki', 'Daftar kerusakan yang telah selesai diperbaiki'],
    'laporan-bulanan': ['Laporan Bulanan', 'Format dokumen resmi bulanan SMK Dwijendra Denpasar'],
    'laporan-tahunan': ['Laporan Tahunan', 'Rekapitulasi dan evaluasi kerusakan inventaris tahunan'],
    'import': ['Impor Data Excel Lama', 'Migrasi data dari workbook bulanan Januari s/d Desember'],
    'pengaturan': ['Pengaturan Sistem', 'Identitas sekolah, tanda tangan, dan format laporan'],
    'users': ['Kelola Pengguna', 'Manajemen akun pengguna dan hak akses'],
    'log': ['Log Aktivitas', 'Jejak audit seluruh perubahan pada sistem'],
    'backup': ['Cadangan Data', 'Manajemen cadangan database di Google Drive']
  };

  const info = titleMap[viewName] || ['Inventaris', ''];
  document.getElementById('page-title').textContent = info[0];
  document.getElementById('page-subtitle').textContent = info[1];

  // Muat data untuk view bersangkutan
  if (viewName === 'dashboard') loadDashboard();
  else if (viewName === 'input') resetFormKerusakan();
  else if (viewName === 'data') loadTableData(1);
  else if (viewName === 'belum') loadDataBelum();
  else if (viewName === 'sudah') loadDataSudah();
  else if (viewName === 'laporan-bulanan') initLaporanBulananView();
  else if (viewName === 'laporan-tahunan') initLaporanTahunanView();
  else if (viewName === 'pengaturan') loadSettingsData();
  else if (viewName === 'users') loadUsersData();
  else if (viewName === 'log') loadLogData(1);
  else if (viewName === 'backup') loadBackupList();

  // Otomatis tutup sidebar di layar HP saat menu diklik
  if (window.innerWidth <= 768) {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebar-overlay');
    if (sb) sb.classList.remove('open');
    if (ov) ov.style.display = 'none';
  }
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if (!sb) return;
  sb.classList.toggle('open');
  if (ov) {
    ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
  }
}

// Sinkronisasi Terpadu: Menyegarkan Data Tampilan Aktif & Angka Badge Sidebar
async function refreshCurrentViewAndBadges() {
  try {
    const belumRes = await callApi('laporan.list', { status: 'BELUM', pageSize: 1 });
    const count = belumRes ? (belumRes.total || 0) : 0;
    const badgeSidebar = document.getElementById('nav-badge-belum');
    if (badgeSidebar) badgeSidebar.textContent = count;
    const badgeBelumView = document.getElementById('count-belum-badge');
    if (badgeBelumView) badgeBelumView.textContent = `${count} Item`;
  } catch (e) {}

  if (AppState.activeView === 'dashboard') loadDashboard();
  else if (AppState.activeView === 'data') loadTableData(AppState.currentTableQuery.page || 1);
  else if (AppState.activeView === 'belum') loadDataBelum();
  else if (AppState.activeView === 'sudah') loadDataSudah();
  else if (AppState.activeView === 'laporan-bulanan') generateLaporanBulanan();
  else if (AppState.activeView === 'laporan-tahunan') generateLaporanTahunan();
  else if (AppState.activeView === 'log') loadLogData(1);
}

// Manual Cloud Synchronization Trigger (Tombol Topbar / Pengaturan)
async function triggerManualSync() {
  const btn = document.getElementById('btn-sync-cloud');
  const txt = document.getElementById('cloud-sync-text');
  if (txt) txt.textContent = 'Menyinkronkan...';
  showToast('Sedang menyinkronkan data antar-perangkat...', 'info', 2000);
  try {
    await callApi('sync.pull');
    await loadMasterData();
    await refreshCurrentViewAndBadges();
    showToast('✅ Data laporan berhasil disinkronkan antar-perangkat!', 'success', 3500);
  } catch (err) {
    showToast('Sinkronisasi cloud gagal: ' + err.message, 'warning', 3500);
  }
}

// =============================================================================
// 5. MASTER DATA (BARANG & LOKASI)
// =============================================================================

async function loadMasterData() {
  try {
    const res = await callApi('master.get');
    AppState.master = res;

    // Isi Datalist Barang
    const bList = document.getElementById('list-master-barang');
    if (bList) {
      bList.innerHTML = '';
      res.barang.forEach((b) => {
        const opt = document.createElement('option');
        opt.value = b.nama;
        bList.appendChild(opt);
      });
    }

    // Isi Dropdown Lokasi Form & Filter
    populateLokasiDropdowns(res.lokasi);
  } catch (err) {
    console.error('Gagal memuat master data:', err);
  }
}

function populateLokasiDropdowns(lokasiList) {
  const selects = [
    document.getElementById('input-lokasi-barang'),
    document.getElementById('dash-filter-lokasi'),
    document.getElementById('tbl-filter-lokasi'),
    document.getElementById('lap-bul-lokasi')
  ];

  selects.forEach((sel) => {
    if (!sel) return;
    const isForm = (sel.id === 'input-lokasi-barang');
    const currentVal = sel.value;

    sel.innerHTML = isForm
      ? '<option value="">-- Pilih Lokasi / Ruangan --</option>'
      : '<option value="">Semua Ruangan</option>';

    lokasiList.forEach((l) => {
      const opt = document.createElement('option');
      opt.value = l.nama;
      opt.textContent = l.nama;
      sel.appendChild(opt);
    });

    if (isForm) {
      const optOther = document.createElement('option');
      optOther.value = '__OTHER__';
      optOther.textContent = '➕ Lokasi lainnya (Tambah baru)';
      sel.appendChild(optOther);
    }

    if (currentVal) sel.value = currentVal;
  });
}

function checkLokasiLainnya(selectEl) {
  const customInput = document.getElementById('input-lokasi-lainnya');
  if (!customInput) return;
  if (selectEl.value === '__OTHER__') {
    customInput.style.display = 'block';
    customInput.required = true;
    customInput.focus();
  } else {
    customInput.style.display = 'none';
    customInput.required = false;
    customInput.value = '';
  }
}

// =============================================================================
// 6. DASHBOARD CONTROLLER (6 KARTU STATISTIK & 4 GRAFIK)
// =============================================================================

async function loadDashboard() {
  const year = document.getElementById('dash-filter-year').value;
  const month = document.getElementById('dash-filter-month').value;
  const lokasi = document.getElementById('dash-filter-lokasi').value;
  const status = document.getElementById('dash-filter-status').value;

  try {
    const data = await callApi('dashboard.get', { year, month, lokasi, status });

    // 1. Sinkronkan Dropdown Tahun jika belum terisi
    populateYearSelect('dash-filter-year', data.daftarTahun, data.grafik.tahunAktif);

    // 2. Isi 6 Kartu Statistik
    const st = data.statistik;
    document.getElementById('stat-total-kejadian').textContent = formatNumber(st.totalKejadian);
    document.getElementById('stat-total-barang').textContent = formatNumber(st.totalBarangTerdampak);
    document.getElementById('stat-belum').textContent = formatNumber(st.belumDiperbaiki);
    document.getElementById('stat-sudah').textContent = formatNumber(st.sudahDiperbaiki);
    document.getElementById('stat-bulan-berjalan').textContent = formatNumber(st.bulanBerjalanCount);
    document.getElementById('stat-persentase').textContent = `${st.persentasePenyelesaian}%`;

    // Perbarui badge sidebar
    document.getElementById('nav-badge-belum').textContent = st.belumDiperbaiki;

    // 3. Render 4 Grafik
    renderDashboardCharts(data.grafik);

    // 4. Render Perlu Tindak Lanjut
    renderPerluTindakLanjut(data.perluTindakLanjut);

    // 5. Render Aktivitas Terbaru
    renderAktivitasTerbaru(data.aktivitasTerbaru);
  } catch (err) {
    showToast('Gagal memuat data dashboard: ' + err.message, 'error');
  }
}

function populateYearSelect(selectId, yearsList, selectedYear, allowAll = false) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  if (sel.options.length > 0 && !allowAll) return;
  const currentVal = sel.value;
  sel.innerHTML = '';
  if (allowAll) {
    const optAll = document.createElement('option');
    optAll.value = '';
    optAll.textContent = 'Semua Tahun';
    if (!selectedYear) optAll.selected = true;
    sel.appendChild(optAll);
  }
  yearsList.forEach((y) => {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    if (String(y) === String(selectedYear || currentVal)) opt.selected = true;
    sel.appendChild(opt);
  });
}

function resetDashboardFilter() {
  document.getElementById('dash-filter-month').value = '';
  document.getElementById('dash-filter-lokasi').value = '';
  document.getElementById('dash-filter-status').value = '';
  loadDashboard();
}

function renderDashboardCharts(gData) {
  // Grafik 1: Tren Kerusakan Bulanan (Jan - Des)
  renderChart('chart-tren-bulanan', 'bar', {
    labels: gData.trenBulanan.map((b) => b.namaBulan.substring(0, 3)),
    datasets: [
      {
        label: 'Sudah Diperbaiki',
        data: gData.trenBulanan.map((b) => b.sudah),
        backgroundColor: '#10b981',
        borderRadius: 4
      },
      {
        label: 'Belum Diperbaiki',
        data: gData.trenBulanan.map((b) => b.belum),
        backgroundColor: '#ef4444',
        borderRadius: 4
      }
    ]
  }, {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      x: { stacked: true },
      y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }
    }
  });

  // Grafik 2: Donut Status Perbaikan
  renderChart('chart-status-donut', 'doughnut', {
    labels: gData.statusChart.labels,
    datasets: [{
      data: gData.statusChart.counts,
      backgroundColor: ['#10b981', '#ef4444'],
      hoverOffset: 6
    }]
  }, {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'bottom' }
    }
  });

  // Grafik 3: Kerusakan Berdasarkan Ruangan (Horizontal Bar)
  renderChart('chart-lokasi-bar', 'bar', {
    labels: gData.topLokasi.map((l) => l.nama),
    datasets: [{
      label: 'Kejadian Kerusakan',
      data: gData.topLokasi.map((l) => l.totalKejadian),
      backgroundColor: '#3b82f6',
      borderRadius: 4
    }]
  }, {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
  });

  // Grafik 4: Kerusakan Berdasarkan Nama Barang (Horizontal Bar)
  renderChart('chart-barang-bar', 'bar', {
    labels: gData.topBarang.map((b) => b.nama),
    datasets: [{
      label: 'Kejadian Kerusakan',
      data: gData.topBarang.map((b) => b.totalKejadian),
      backgroundColor: '#8b5cf6',
      borderRadius: 4
    }]
  }, {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
  });
}

function renderChart(canvasId, type, data, options) {
  if (AppState.charts[canvasId]) {
    try { AppState.charts[canvasId].destroy(); } catch (e) {}
  }
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (typeof Chart === 'undefined') {
    console.warn('Library Chart.js belum tersedia di browser untuk canvas: ' + canvasId);
    return;
  }
  try {
    AppState.charts[canvasId] = new Chart(ctx, { type, data, options });
  } catch (err) {
    console.warn('Gagal merender chart ' + canvasId + ':', err);
  }
}

function renderPerluTindakLanjut(items) {
  const tbody = document.getElementById('tbody-perlu-tindak');
  if (!tbody) return;
  if (!items || !items.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--success-600);">🎉 Tidak ada barang rusak yang belum ditangani!</td></tr>';
    return;
  }
  tbody.innerHTML = items.map((r) => `
    <tr>
      <td style="font-size:12px; white-space:nowrap;">${formatDateIndo(r.tglRusak)}</td>
      <td style="font-weight:600;">${escapeHtml(r.nama)}</td>
      <td><span class="badge" style="background:var(--neutral-100);">${escapeHtml(r.lokasi)}</span></td>
      <td style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(r.kondisi)}</td>
      <td style="text-align:center;">
        <button class="btn btn-secondary" onclick="openDetailModal('${r.id}')" style="font-size:11px; padding:3px 8px;">Tindak Lanjut</button>
      </td>
    </tr>
  `).join('');
}

async function handlePhotoSelect(event, jenis) {
  const files = Array.from(event.target.files);
  if (!files.length) return;

  for (const file of files) {
    if (AppState.photosPending[jenis].length >= 10) {
      showToast('Maksimal 10 foto untuk setiap jenis dokumentasi.', 'warning');
      break;

    try {

// Kompresi Canvas di Browser sebelum Upload
function processImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      return reject(new Error('Format foto harus JPG, PNG, atau WEBP.'));
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try {
          // 1. Gambar Utama: Maks 1280px (Kualitas Tajam HD namun Sangat Ringan ~80-120KB)
          const maxDim = 1280;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const fullDataUrl = canvas.toDataURL('image/jpeg', 0.78);

          // 2. Thumbnail Cepat: Maks 160px (Super Ringan ~5-8KB)
          const tCanvas = document.createElement('canvas');
          const tw = 160, th = Math.round((h * tw) / w);
          tCanvas.width = tw; tCanvas.height = th;
          const tCtx = tCanvas.getContext('2d');
          tCtx.drawImage(canvas, 0, 0, tw, th);
          const thumbDataUrl = tCanvas.toDataURL('image/jpeg', 0.65);

          resolve({
            name: file.name,
            mime: 'image/jpeg',
            dataBase64: fullDataUrl.split(',')[1],
            thumbBase64: thumbDataUrl.split(',')[1],
            previewUrl: thumbDataUrl
          });
        } catch (err) {
          reject(err);
        }
      };
      img.onerror = () => reject(new Error('File gambar tidak valid.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Gagal membaca file.'));
    reader.readAsDataURL(file);
  });
}

async function submitLaporanForm(isInputBaru = false) {
  const form = document.getElementById('form-kerusakan');
  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  const id = document.getElementById('input-laporan-id').value;
  const versi = document.getElementById('input-laporan-versi').value;

  let lokasiVal = document.getElementById('input-lokasi-barang').value;
  if (lokasiVal === '__OTHER__') {
    lokasiVal = document.getElementById('input-lokasi-lainnya').value.trim();
    if (!lokasiVal) {
      setFieldError('input-lokasi', 'Ketik nama lokasi baru.');
      return;
    }
  }

  const payload = {
    id: id,
    versi: versi,
    nama: document.getElementById('input-nama-barang').value.trim(),
    kode: document.getElementById('input-kode-inventaris').value.trim(),
    jumlah: parseInt(document.getElementById('input-jumlah-barang').value, 10),
    lokasi: lokasiVal,
    kondisi: document.getElementById('input-kondisi-kerusakan').value.trim(),
    tglRusak: document.getElementById('input-tgl-rusak').value,
    tglPerbaikan: document.getElementById('input-tgl-perbaikan').value || '',
    keterangan: document.getElementById('input-keterangan').value.trim(),
    koreksiHistoris: document.getElementById('chk-koreksi-historis')?.checked || false,
    alasanKoreksi: document.getElementById('input-alasan-koreksi')?.value.trim() || '',
    requestId: 'REQ-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8)
  };

  const btnSimpan = document.getElementById('btn-simpan-laporan');
  const btnInputBaru = document.getElementById('btn-simpan-input-baru');
  btnSimpan.disabled = true;
  btnInputBaru.disabled = true;
  btnSimpan.textContent = 'Menyimpan...';

  try {
    const isEdit = !!id;
    const res = await callApi(isEdit ? 'laporan.update' : 'laporan.create', payload);
    const targetLaporanId = isEdit ? id : res.id;

    // Unggah Foto Kerusakan Pending
    if (AppState.photosPending.kerusakan.length > 0) {
      for (const p of AppState.photosPending.kerusakan) {
        await callApi('foto.upload', {
          laporanId: targetLaporanId,
          jenis: 'KERUSAKAN',
          nama: p.name,
          data: p.dataBase64,
          thumb: p.thumbBase64
        });
      }
    }

    // Unggah Foto Perbaikan Pending
    if (AppState.photosPending.perbaikan.length > 0) {
      for (const p of AppState.photosPending.perbaikan) {
        await callApi('foto.upload', {
          laporanId: targetLaporanId,
          jenis: 'PERBAIKAN',
          nama: p.name,
          data: p.dataBase64,
          thumb: p.thumbBase64
        });
      }
    }

    showToast(`Laporan ${targetLaporanId} berhasil disimpan!`, 'success');
    await loadMasterData();
    await refreshCurrentViewAndBadges();

    // Pastikan seluruh modul inti langsung tersegarkan
    if (typeof loadDashboard === 'function') loadDashboard();
    if (typeof loadTableData === 'function') loadTableData(1);

    if (isInputBaru) {
      resetFormKerusakan();
    } else {
      navigateTo('data');
    }
  } catch (err) {
    if (err.fields) {
      Object.keys(err.fields).forEach((f) => setFieldError(`input-${f}`, err.fields[f]));
    } else {
      showToast(err.message, 'error', 4500);
    }
  } finally {
    btnSimpan.disabled = false;
    btnInputBaru.disabled = false;
    btnSimpan.textContent = 'Simpan Data';
  }
}

function renderPaginationControls(page, pages, total) {
  document.getElementById('tbl-pagination-info').textContent = `Menampilkan halaman ${page} dari ${pages} (${formatNumber(total)} total data)`;
  const controls = document.getElementById('tbl-pagination-controls');
  if (!controls) return;

  let btns = [];
  btns.push(`<button class="btn-page" ${page <= 1 ? 'disabled' : ''} onclick="loadTableData(${page - 1})">‹</button>`);
  for (let i = Math.max(1, page - 2); i <= Math.min(pages, page + 2); i++) {
    btns.push(`<button class="btn-page ${i === page ? 'active' : ''}" onclick="loadTableData(${i})">${i}</button>`);
  }
  btns.push(`<button class="btn-page ${page >= pages ? 'disabled' : ''} onclick="loadTableData(${page + 1})">›</button>`);
  controls.innerHTML = btns.join('');
}

async function exportCurrentTableExcel() {
  try {
    showToast('Menyiapkan ekspor file Excel...', 'info');
    const query = { ...AppState.currentTableQuery, page: 1, pageSize: 5000 };
    const res = await callApi('laporan.list', query);
    const rows = res.rows || [];

    if (!rows.length) {
      showToast('Tidak ada data kerusakan yang sesuai filter untuk diekspor.', 'warning');
      return;
    }

    const wsData = [
      ['DATA KERUSAKAN INVENTARIS SEKOLAH'],
      ['SMK DWIJENDRA DENPASAR'],
      [`Tanggal Ekspor: ${new Date().toLocaleDateString('id-ID')} | Total: ${rows.length} Kejadian`],
      [],
      ['No', 'ID Laporan', 'Nama Barang', 'Kode Inventaris', 'Jumlah', 'Lokasi/Ruangan', 'Kondisi Kerusakan', 'Tanggal Rusak', 'Tanggal Perbaikan', 'Status', 'Dokumentasi Foto', 'Keterangan']
    ];

    rows.forEach((r, idx) => {
      const jmlFoto = ((r.fotoKerusakan && r.fotoKerusakan.length) || 0) + ((r.fotoPerbaikan && r.fotoPerbaikan.length) || 0);
      wsData.push([
        idx + 1,
        r.id,
        r.nama,
        r.kode || '-',
        r.jumlah,
        r.lokasi,
        r.kondisi,
        formatDateIndo(r.tglRusak),
        r.tglPerbaikan ? formatDateIndo(r.tglPerbaikan) : '-',
        r.status,
        jmlFoto ? `${jmlFoto} Foto` : 'Tidak Ada',
        r.keterangan || '-'
      ]);
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [
      { wch: 6 }, { wch: 18 }, { wch: 25 }, { wch: 15 }, { wch: 8 }, { wch: 22 },
      { wch: 35 }, { wch: 16 }, { wch: 16 }, { wch: 18 }, { wch: 16 }, { wch: 35 }
    ];
    XLSX.utils.book_append_sheet(wb, ws, 'Data Kerusakan');
    const stamp = new Date().toISOString().substring(0, 10);
    XLSX.writeFile(wb, `Data_Kerusakan_Inventaris_SMK_Dwijendra_${stamp}.xlsx`);
    showToast(`Berhasil mengekspor ${rows.length} data ke file Excel!`, 'success');
  } catch (err) {
    showToast('Gagal mengekspor Excel: ' + err.message, 'error');
  }
}

async function handleTandaiDiperbaikiSubmit(event) {
  event.preventDefault();
  const id = document.getElementById('perbaiki-laporan-id').value;
  const versi = document.getElementById('perbaiki-laporan-versi').value;
  const tglPerbaikan = document.getElementById('perbaiki-tgl').value;
  const catatan = document.getElementById('perbaiki-catatan').value.trim();

  const btn = document.getElementById('btn-submit-perbaikan');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  try {
    await callApi('laporan.repair', { id, versi, tglPerbaikan, catatan });

    // Unggah foto jika ada
    if (AppState.modalPerbaikanPhotos.length > 0) {
      for (const p of AppState.modalPerbaikanPhotos) {
        await callApi('foto.upload', {
          laporanId: id,
          jenis: 'PERBAIKAN',
          nama: p.name,
          data: p.dataBase64,
          thumb: p.thumbBase64
        });
      }
    }

    showToast('Laporan berhasil ditandai Sudah Diperbaiki!', 'success');
    closeModal('modal-perbaiki');
    closeModal('modal-detail');
    await refreshCurrentViewAndBadges();
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Simpan Hasil Perbaikan';
  }
}

let cachedLaporanBulananData = null;

function initLaporanBulananView() {
  populateYearSelect('lap-bul-year', [2026, 2025, 2024], new Date().getFullYear());

async function generateLaporanBulanan() {
  const year = document.getElementById('lap-bul-year').value;
  const month = document.getElementById('lap-bul-month').value;
  const lokasi = document.getElementById('lap-bul-lokasi').value;
  const status = document.getElementById('lap-bul-status').value;

  const tbody = document.getElementById('tbody-laporan-dinas');
  tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:30px;">Menyusun laporan bulanan...</td></tr>';

  try {
    const res = await callApi('report.bulanan', { year, month, lokasi, status });
    cachedLaporanBulananData = res;

    // Header Laporan
    document.getElementById('doc-th-pelajaran').textContent = `TAHUN PELAJARAN ${res.meta.tahunPelajaran}`;
    document.getElementById('doc-school-name').textContent = res.meta.namaSekolahUpper;
    document.getElementById('doc-bulan-periode').textContent = `PERIODE: ${res.periode.namaBulan.toUpperCase()} ${res.periode.tahun}`;

    // Baris Tabel
    if (!res.rows.length) {
      tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding:35px 20px; color:var(--neutral-400);">
        <div style="font-size:24px; margin-bottom:8px;">📋</div>
        <div style="font-weight:600; font-size:14px; color:var(--neutral-700);">Tidak ada catatan kerusakan inventaris pada periode ini.</div>
        <div style="font-size:12px; margin-top:4px; color:var(--neutral-500);">Periksa pilihan filter bulan/ruangan atau klik tombol di bawah untuk menampilkan seluruh laporan:</div>
        <button class="btn btn-primary" onclick="document.getElementById('lap-bul-month').value='ALL'; generateLaporanBulanan();" style="margin-top:12px; font-size:12px; padding:6px 16px;">
          Tampilkan Semua Bulan (1 Tahun)
        </button>
      </td></tr>`;
    } else {
      tbody.innerHTML = res.rows.map((r) => {
        const fotoKCount = (r.fotoKerusakan && r.fotoKerusakan.length) || 0;
        const fotoPCount = (r.fotoPerbaikan && r.fotoPerbaikan.length) || 0;
        const fotoKHtml = fotoKCount > 0
          ? `<button type="button" class="btn btn-secondary" onclick="openDetailModal('${r.id}')" style="font-size:11px; padding:3px 8px; border-radius:12px; display:inline-flex; align-items:center; gap:4px; cursor:pointer;" title="Klik untuk pratinjau foto">📷 ${fotoKCount} Foto</button>`
          : '<span style="color:var(--neutral-400);">-</span>';
        const fotoPHtml = fotoPCount > 0
          ? `<button type="button" class="btn btn-secondary" onclick="openDetailModal('${r.id}')" style="font-size:11px; padding:3px 8px; border-radius:12px; color:#059669; border-color:#a7f3d0; background:#ecfdf5; display:inline-flex; align-items:center; gap:4px; cursor:pointer;" title="Klik untuk pratinjau foto perbaikan">📷 ${fotoPCount} Foto</button>`
          : '<span style="color:var(--neutral-400);">-</span>';

        return `
          <tr>
            <td style="text-align:center; font-weight:600;">${r.no}</td>
            <td style="font-weight:700; color:var(--neutral-900); min-width:180px;">${escapeHtml(r.nama)}</td>
            <td style="text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px;">${escapeHtml(r.kode || '-')}</td>
            <td style="text-align:center; font-weight:700;">${r.jumlah}</td>
            <td style="min-width:130px;"><span class="badge" style="background:var(--neutral-100);">${escapeHtml(r.lokasi)}</span></td>
            <td style="min-width:200px; line-height:1.4;">${escapeHtml(r.kondisi)}</td>
            <td style="text-align:center; white-space:nowrap;">${fotoKHtml}</td>
            <td style="text-align:center; white-space:nowrap; font-size:12px;">${formatDateIndo(r.tglRusak)}</td>
            <td style="text-align:center; white-space:nowrap; font-size:12px;">${r.tglPerbaikan ? formatDateIndo(r.tglPerbaikan) : '<span style="color:var(--neutral-400);">-</span>'}</td>
            <td style="text-align:center; white-space:nowrap;">${fotoPHtml}</td>
            <td style="min-width:180px; font-size:12px; color:var(--neutral-600); line-height:1.4;">${escapeHtml(r.keterangan || '-')}</td>
          </tr>
        `;
      }).join('');
    }

    // Tanda Tangan Resmi
    const k = res.meta.kiri;
    document.getElementById('sig-kiri-jabatan').textContent = k.jabatan;
    document.getElementById('sig-kiri-nama').textContent = k.nama;
    document.getElementById('sig-kiri-id').textContent = k.id ? `${k.idLabel}. ${k.id}` : '';

    const kn = res.meta.kanan;
    document.getElementById('sig-kanan-tgl').textContent = kn.pembuka;
    document.getElementById('sig-kanan-jabatan').textContent = kn.jabatan;
    document.getElementById('sig-kanan-nama').textContent = kn.nama;
    document.getElementById('sig-kanan-id').textContent = kn.id ? `${kn.idLabel}. ${kn.id}` : '';

  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="11" style="color:red; text-align:center;">Gagal: ${err.message}</td></tr>`;
  }
}

function exportLaporanBulananExcel() {
  if (!cachedLaporanBulananData || !cachedLaporanBulananData.rows.length) {
    showToast('Tidak ada data laporan untuk diekspor.', 'warning');
    return;
  }
  const d = cachedLaporanBulananData;
  const wsData = [
    ['DATA KERUSAKAN INVENTARIS'],
    [`TAHUN PELAJARAN ${d.meta.tahunPelajaran}`],
    [d.meta.namaSekolahUpper],
    [`BULAN: ${d.periode.namaBulan.toUpperCase()} ${d.periode.tahun}`],
    [],
    ['No', 'Nama Barang', 'Kode Inventaris', 'Jumlah', 'Lokasi/Ruangan', 'Kondisi Kerusakan', 'Dokumentasi Kerusakan', 'Tanggal Rusak', 'Tanggal Perbaikan', 'Dokumentasi Setelah Perbaikan', 'Keterangan']
  ];

  d.rows.forEach((r) => {
    wsData.push([
      r.no, r.nama, r.kode, r.jumlah, r.lokasi, r.kondisi,
      r.fotoKerusakan.length ? 'Ada' : '-', r.tglRusakIndo, r.tglPerbaikanIndo,
      r.fotoPerbaikan.length ? 'Ada' : '-', r.keterangan
    ]);
  });

  wsData.push([]);
  wsData.push(['Mengetahui,', '', '', '', '', '', '', `${d.meta.kota}, ${d.meta.tanggalCetakLabel}`]);
  wsData.push([d.meta.kiri.jabatan, '', '', '', '', '', '', d.meta.kanan.jabatan]);
  wsData.push([]);
  wsData.push([]);
  wsData.push([d.meta.kiri.nama, '', '', '', '', '', '', d.meta.kanan.nama]);
  wsData.push([d.meta.kiri.id ? `${d.meta.kiri.idLabel}. ${d.meta.kiri.id}` : '', '', '', '', '', '', '', d.meta.kanan.id ? `${d.meta.kanan.idLabel}. ${d.meta.kanan.id}` : '']);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  XLSX.utils.book_append_sheet(wb, ws, d.periode.namaBulan);
  XLSX.writeFile(wb, `Laporan_Kerusakan_${d.periode.namaBulan}_${d.periode.tahun}.xlsx`);
  showToast('File Excel laporan bulanan berhasil diunduh.', 'success');
}

function handleExcelFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });

      // Kumpulkan data seluruh sheet
      const sheetsPayload = [];
      workbook.SheetNames.forEach((sName) => {
        const worksheet = workbook.Sheets[sName];
        const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
        sheetsPayload.push({ name: sName, rows: rawRows });
      });

      showToast(`Membaca ${workbook.SheetNames.length} sheet bulanan...`, 'info');

      // Kirim ke Backend untuk Validasi Pratinjau
      const previewRes = await callApi('import.preview', {
        sheets: sheetsPayload,
        year: 2026
      });

      // Simpan seluruh data valid siap impor (bukan hanya 15 data sampel)
      AppState.excelImportBatch = previewRes.items || previewRes.validItems || previewRes.sampleValid;

      // Tampilkan Hasil Pratinjau
      document.getElementById('import-preview-box').style.display = 'block';
      document.getElementById('imp-total-baca').textContent = previewRes.totalDibaca;
      document.getElementById('imp-siap-impor').textContent = previewRes.siapImpor;
      document.getElementById('imp-duplikat').textContent = previewRes.duplikatDilewati;
      document.getElementById('imp-gagal').textContent = previewRes.gagal;

      document.getElementById('tbody-import-sample').innerHTML = (previewRes.sampleValid || []).slice(0, 10).map((r) => `
        <tr>
          <td><b>${escapeHtml(r.sheetName)}</b></td>
          <td>${escapeHtml(r.nama)}</td>
          <td>${escapeHtml(r.lokasi)}</td>
          <td>${r.jumlah}</td>
          <td>${formatDateIndo(r.tglRusak)}</td>
          <td>${r.tglPerbaikan ? formatDateIndo(r.tglPerbaikan) : '-'}</td>
          <td>${renderStatusBadge(r.status)}</td>
        </tr>
      `).join('');

    } catch (err) {
      showToast('Gagal memproses file Excel: ' + err.message, 'error', 5000);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function executeExcelImport() {
  if (!AppState.excelImportBatch || !AppState.excelImportBatch.length) {
    showToast('Tidak ada data siap impor.', 'warning');
    return;
  }
  const btn = document.getElementById('btn-eksekusi-impor');
  btn.disabled = true;
  btn.textContent = 'Mengimpor ke Database...';

  try {
    const res = await callApi('import.execute', { items: AppState.excelImportBatch });
    showToast(res.pesan, 'success', 5000);
    cancelImport();
    await loadMasterData();
    await refreshCurrentViewAndBadges();
    navigateTo('data');
  } catch (err) {
    showToast(err.message, 'error', 5000);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Eksekusi Simpan Data';
  }
}

function hasPermission(perm) {
  return AppState.user && AppState.user.permissions && AppState.user.permissions.includes(perm);
}

function getTodayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${('0' + (d.getMonth() + 1)).slice(-2)}-${('0' + d.getDate()).slice(-2)}`;
}

function formatDateIndo(isoStr) {
  if (!isoStr) return '-';
  const p = isoStr.split('-');
  if (p.length < 3) return isoStr;
  return `${parseInt(p[2], 10)} ${BULAN_NAMES[parseInt(p[1], 10) - 1]} ${p[0]}`;
}

function formatNumber(num) {
  return Number(num || 0).toLocaleString('id-ID');
}

function formatFileSize(bytes) {
  if (!bytes) return '0 B';
  const k = 1024, dm = 1;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

function renderStatusBadge(status) {
  if (status === 'Sudah Diperbaiki') {
    return '<span class="badge badge-sudah">Sudah Diperbaiki</span>';
  }
  return '<span class="badge badge-belum">Belum Diperbaiki</span>';
}

function setFieldError(fieldId, msg) {
  const group = document.getElementById(`grp-${fieldId}`) || document.getElementById(`group-${fieldId}`);
  if (group) group.classList.add('has-error');
  const errEl = document.getElementById(`err-${fieldId}`);
  if (errEl) errEl.textContent = msg;
}

function clearFieldError(fieldId) {
  const group = document.getElementById(`grp-${fieldId}`) || document.getElementById(`group-${fieldId}`);
  if (group) group.classList.remove('has-error');
  const errEl = document.getElementById(`err-${fieldId}`);
  if (errEl) errEl.textContent = '';
}
